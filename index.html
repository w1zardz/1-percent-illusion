        /* Toast */

    <div class="toast" id="toast"></div>

    <script>
        const BREAD_PRICE = 45;
        const CASHBACK_RATE = 0.01;

        let selectedTarget = document.querySelector('.target-btn.active');

        // Target selection
        document.getElementById('targets').addEventListener('click', (e) => {
            const btn = e.target.closest('.target-btn');
            if (!btn) return;
            document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedTarget = btn;
        });

        // Calculate
        document.getElementById('calcBtn').addEventListener('click', calculate);

        // Also calculate on Enter
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') calculate();
            });
        });

        function calculate() {
            const salary = parseFloat(document.getElementById('salary').value);
            const spending = parseFloat(document.getElementById('spending').value);

            if (!salary || salary <= 0) {
                showToast('Введи зарплату');
                return;
            }
            if (!spending || spending <= 0) {
                showToast('Введи траты');
                return;
            }
            if (spending > salary) {
                showToast('Траты больше зарплаты... знакомо');
                return;
            }

            const targetPrice = parseInt(selectedTarget.dataset.price);
            const targetName = selectedTarget.dataset.name;
            const targetEmoji = selectedTarget.dataset.emoji;

            const monthlyCashback = spending * CASHBACK_RATE;
            const monthsNeeded = Math.ceil(targetPrice / monthlyCashback);
            const yearsNeeded = monthsNeeded / 12;
            const breadNeeded = Math.ceil(spending / BREAD_PRICE) * monthsNeeded;
            const yearlyProgress = (monthlyCashback * 12 / targetPrice) * 100;
            const finishYear = new Date().getFullYear() + Math.ceil(yearsNeeded);

            // Display results
            document.getElementById('resultEmoji').textContent = yearsNeeded > 100 ? '💀' : yearsNeeded > 20 ? '😱' : yearsNeeded > 5 ? '😰' : '😅';

            const yearsEl = document.getElementById('resultYears');
            if (yearsNeeded >= 1) {
                yearsEl.textContent = formatNumber(Math.round(yearsNeeded * 10) / 10) + (yearsNeeded >= 100 ? '' : yearsNeeded === 1 ? ' год' : yearsNeeded < 5 ? ' года' : ' лет');
            } else {
                yearsEl.textContent = monthsNeeded + ' мес.';
            }

            document.getElementById('resultLabel').textContent = `копить на ${targetName}`;
            document.getElementById('resultComment').textContent = getComment(yearsNeeded, targetName);

            document.getElementById('statMonthly').textContent = formatMoney(monthlyCashback);
            document.getElementById('statTotal').textContent = formatNumber(monthsNeeded);
            document.getElementById('statBread').textContent = formatNumber(breadNeeded);
            document.getElementById('statYear').textContent = finishYear + ' г.';

            const barWidth = Math.min(yearlyProgress, 100);
            document.getElementById('timelineBar').style.width = barWidth + '%';
            document.getElementById('timelineTarget').textContent = formatMoney(targetPrice);
            document.getElementById('timelinePercent').textContent = `За год накопишь ${yearlyProgress.toFixed(2)}% стоимости`;

            const resultsEl = document.getElementById('results');
            resultsEl.classList.add('visible');
            resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

            // Share button
            document.getElementById('shareBtn').onclick = () => shareResult(yearsNeeded, targetName, monthlyCashback, breadNeeded, finishYear);
        }

        function getComment(years, target) {
            if (years > 1000) return `К этому моменту ${target} будет в музее древностей`;
            if (years > 100) return `Твои правнуки, возможно, дождутся`;
            if (years > 50) return `Начни копить — внуки скажут спасибо`;
            if (years > 20) return `На пенсии как раз купишь!`;
            if (years > 10) return `Лет через 10 технологии уйдут вперёд...`;
            if (years > 5) return `Всего-то подождать... немного...`;
            if (years > 2) return `Ну, реально, но больно`;
            if (years > 1) return `Почти реально! Но хлеба нужно МНОГО`;
            return `О, это даже выглядит возможным!`;
        }

        function formatNumber(n) {
            return n.toLocaleString('ru-RU');
        }

        function formatMoney(n) {
            if (n >= 1) {
                return Math.round(n).toLocaleString('ru-RU') + ' \u20BD';
            }
            return n.toFixed(2) + ' \u20BD';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function shareResult(years, target, monthly, bread, finishYear) {
            const text = `1% Illusion \uD83D\uDCA1\n\nМне нужно ${years >= 1 ? Math.round(years * 10) / 10 + ' лет' : Math.ceil(years * 12) + ' мес.'} чтобы накопить на ${target} с 1% кэшбэка!\n\nКэшбэк в месяц: ${formatMoney(monthly)}\nБатонов хлеба: ${formatNumber(bread)} \uD83C\uDF5E\nГод накопления: ${finishYear}\n\nУзнай свою боль: https://w1zardz.github.io/1-percent-illusion/`;

            if (navigator.share) {
                navigator.share({ title: '1% Illusion', text: text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Скопировано!');
                }).catch(() => {
                    showToast('Не удалось скопировать');
                });
            }
        }
    </script>
</body>
</html>
